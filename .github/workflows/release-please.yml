name: Build, Bump Version, and Commit

on:
  push:
    branches:
      - main
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: 升级npm
        run: |
          # OIDC trusted publishing 需要 npm >= 11.5.1
          npm install -g npm@^11.5.1
          node --version
          npm --version

      - name: 安装pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.1

      - name: 安装依赖
        run: |
          pnpm install

      - name: 更新版本号
        uses: google-github-actions/release-please-action@v4
        id: release_please
        with:
          release-type: node

      - name: 删除 pnpm-lock.yaml
        run: rm -rf pnpm-lock.yaml

      - name: 编译
        run: pnpm build

      - name: 设置时区
        run: |
          sudo timedatectl set-timezone Asia/Shanghai

      - name: 设置git用户名和邮箱
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: 删除开发依赖
        run: npm run pr clean

      - name: 删除文件
        run: |
          rm -rf src .github tsconfig.json eslint.config.mjs

      - name: 推送build分支
        run: |
          sed -i '19d' .gitignore
          git checkout -b build || git checkout build
          git add .
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "No changes detected"
            exit 0
          else
            git commit -m "chore(build): ${{ github.event.head_commit.message }}"
          fi
          git push origin build --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 打包
        run: |
          zip -r build.zip lib package.json README.md LICENSE CHANGELOG.md config resources

      - name: 上传 build.zip
        uses: actions/upload-artifact@v4
        with:
          name: build-zip
          path: build.zip

      - name: 发布到 npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "karin-plugin-teamspeak@$VERSION" version >/dev/null 2>&1; then
            echo "karin-plugin-teamspeak@$VERSION 已存在于 npm，跳过发布"
            exit 0
          fi
          npm publish --provenance --access public

      - name: 上传 release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build.zip --clobber
          else
            echo "Release $TAG 不存在，跳过上传"
          fi
